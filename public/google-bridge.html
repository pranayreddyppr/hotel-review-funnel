<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Google Review</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .bridge-stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 20px 0 12px;
    }
    .bridge-star {
      font-size: 3rem;
      color: #ccc;
      line-height: 1;
    }
    .bridge-star.lit {
      color: #f5a623;
    }
    .instruction-box {
      background: #fff8ec;
      border: 1.5px solid #f5a623;
      border-radius: 12px;
      padding: 18px 20px;
      margin: 20px 0 28px;
      text-align: left;
    }
    .instruction-box p {
      font-size: 1rem;
      color: #444;
      line-height: 1.55;
      margin: 0;
    }
    .instruction-box strong {
      color: #222;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .step:last-child { margin-bottom: 0; }
    .step-num {
      background: #f5a623;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .step-text { font-size: 0.97rem; color: #333; line-height: 1.5; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      background-color: #4285f4;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .btn-google:hover { background-color: #3367d6; }
    .btn-google:active { transform: scale(0.98); }
    .btn-google svg { flex-shrink: 0; }
    .thanks-note {
      margin-top: 18px;
      font-size: 0.88rem;
      color: #888;
    }
    .rating-label {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0;
    }
    .rating-sub {
      font-size: 1rem;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="hotel-logo" class="hotel-logo" src="" alt="" style="display:none" />

    <p class="rating-label" id="rating-label">&#9733; 5 Stars — Excellent!</p>
    <p class="rating-sub">Thank you! Please share your experience on Google.</p>

    <div class="bridge-stars" id="bridge-stars">
      <span class="bridge-star" data-v="1">&#9733;</span>
      <span class="bridge-star" data-v="2">&#9733;</span>
      <span class="bridge-star" data-v="3">&#9733;</span>
      <span class="bridge-star" data-v="4">&#9733;</span>
      <span class="bridge-star" data-v="5">&#9733;</span>
    </div>

    <div class="instruction-box">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Tap the button below — Google Reviews will open.</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text" id="step2-text">Select <strong>5 stars</strong> on Google (same as your rating above).</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">Tap <strong>Post</strong> — you're done!</div>
      </div>
    </div>

    <a id="google-btn" class="btn-google" href="#" target="_blank" rel="noopener noreferrer">
      <svg width="22" height="22" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.333 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/>
        <path d="M6.306 14.691l6.571 4.819C14.655 15.108 19.001 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/>
        <path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.316 0-9.828-3.415-11.48-8.17l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/>
        <path d="M43.611 20.083H42V20H24v8h11.303a11.924 11.924 0 01-4.048 5.571l.002-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/>
      </svg>
      Open Google Reviews
    </a>

    <p class="thanks-note">Opens in a new tab. Your feedback means a lot to us!</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var hotelSlug = params.get('hotel');
    var rating = parseInt(params.get('rating')) || 5;
    var googleUrl = params.get('url');

    // Redirect home if bad params
    if (!hotelSlug || !googleUrl) {
      window.location.replace('/');
    }

    // Highlight stars
    var ratingLabels = { 1: 'Terrible', 2: 'Poor', 3: 'Okay', 4: 'Great', 5: 'Excellent' };
    document.getElementById('rating-label').textContent =
      '\u2605 ' + rating + ' Star' + (rating !== 1 ? 's' : '') + ' \u2014 ' + (ratingLabels[rating] || '');

    document.getElementById('step2-text').innerHTML =
      'Select <strong>' + rating + ' star' + (rating !== 1 ? 's' : '') + '</strong> on Google (same as your rating above).';

    document.querySelectorAll('.bridge-star').forEach(function(el) {
      if (parseInt(el.getAttribute('data-v')) <= rating) {
        el.classList.add('lit');
      }
    });

    // Set Google link
    var btn = document.getElementById('google-btn');
    btn.href = googleUrl;

    // Load hotel logo
    if (hotelSlug) {
      fetch('/api/config?hotel=' + encodeURIComponent(hotelSlug))
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data && data.hotelLogo) {
            var logo = document.getElementById('hotel-logo');
            logo.src = data.hotelLogo;
            logo.alt = (data.hotelName || '') + ' logo';
            logo.style.display = 'block';
          }
        })
        .catch(function() {});
    }
  </script>
</body>
</html>
