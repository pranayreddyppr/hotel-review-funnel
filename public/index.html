<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate Your Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <img id="hotel-logo" class="hotel-logo" src="" alt="" style="display:none" />
    <h1 class="hotel-name" id="hotel-name">Loading...</h1>
    <p class="cold-start-msg" id="cold-start-msg"></p>

    <div class="divider"></div>

    <div class="room-wrap" id="room-wrap">
      <label class="room-label" for="room-input">What was your room number?</label>
      <input type="tel" id="room-input" class="room-input" placeholder="e.g. 115" maxlength="3" inputmode="numeric" autocomplete="off" />
      <p class="room-error" id="room-error"></p>
      <button class="room-skip" id="room-skip" type="button">I don&#39;t know my room number</button>
    </div>

    <p class="question" id="question" style="display:none">How was your stay?</p>

    <div class="stars" id="stars" aria-hidden="true">
      <button class="star" data-value="1" aria-label="1 star" disabled>&#9733;</button>
      <button class="star" data-value="2" aria-label="2 stars" disabled>&#9733;</button>
      <button class="star" data-value="3" aria-label="3 stars" disabled>&#9733;</button>
      <button class="star" data-value="4" aria-label="4 stars" disabled>&#9733;</button>
      <button class="star" data-value="5" aria-label="5 stars" disabled>&#9733;</button>
    </div>

    <p id="star-label" class="star-label">&nbsp;</p>

    <p class="status-message" id="status"></p>
  </div>

  <script>
    var hotelSlug = new URLSearchParams(window.location.search).get('hotel');
    var hotelNameEl = document.getElementById('hotel-name');
    var coldStartEl = document.getElementById('cold-start-msg');

    // If no hotel slug in URL, show error and disable stars
    if (!hotelSlug) {
      hotelNameEl.textContent = 'Hotel not found. Please check your link.';
      hotelNameEl.style.color = '#d0021b';
      document.querySelectorAll('.star').forEach(function(s) { s.disabled = true; });
    } else {
      // Retry fetching hotel name up to 3 times with 5s delay (cold start resilience)
      var attempts = 0;
      var coldStartTimer = setTimeout(function() {
        coldStartEl.textContent = 'Waking up the server, one moment…';
      }, 5000);

      function fetchConfig() {
        attempts++;
        fetch('/api/config?hotel=' + encodeURIComponent(hotelSlug))
          .then(function(response) {
            if (!response.ok) throw new Error('not ok');
            return response.json();
          })
          .then(function(data) {
            clearTimeout(coldStartTimer);
            coldStartEl.textContent = '';
            hotelNameEl.classList.remove('loading-pulse');
            hotelNameEl.textContent = data.hotelName;
            document.title = data.hotelName + ' — Rate Your Stay';
            if (data.hotelLogo) {
              var logoEl = document.getElementById('hotel-logo');
              logoEl.src = data.hotelLogo;
              logoEl.alt = data.hotelName + ' logo';
              logoEl.style.display = 'block';
            }
            if (data.theme) { applyTheme(data.theme); try { sessionStorage.setItem('ht_' + hotelSlug, JSON.stringify(data.theme)); } catch(e) {} }
          })
          .catch(function() {
            if (attempts < 3) {
              setTimeout(fetchConfig, 5000);
            } else {
              clearTimeout(coldStartTimer);
              coldStartEl.textContent = '';
              hotelNameEl.classList.remove('loading-pulse');
              hotelNameEl.textContent = 'Rate Your Stay';
            }
          });
      }
      hotelNameEl.classList.add('loading-pulse');
      fetchConfig();
    }

    // Star labels
    var starLabels = { 1: 'Terrible', 2: 'Poor', 3: 'Okay', 4: 'Great', 5: 'Excellent' };
    var starLabelEl = document.getElementById('star-label');
    var stars = document.querySelectorAll('.star');
    var selectedRating = 0;
    var submitted = false;
    var roomNumber = null;      // null = 'I don't know'
    var roomConfirmed = false;

    var roomInput  = document.getElementById('room-input');
    var roomError  = document.getElementById('room-error');
    var roomSkip   = document.getElementById('room-skip');
    var roomWrap   = document.getElementById('room-wrap');
    var questionEl = document.getElementById('question');
    var starsEl    = document.getElementById('stars');

    var VALID_ROOMS = [];
    for (var i = 101; i <= 130; i++) VALID_ROOMS.push(i);
    for (var i = 201; i <= 230; i++) VALID_ROOMS.push(i);

    function validateRoom(val) {
      var n = parseInt(val, 10);
      return !isNaN(n) && VALID_ROOMS.indexOf(n) !== -1;
    }

    function enableStars(room) {
      roomNumber = room;
      roomConfirmed = true;
      roomWrap.style.display = 'none';
      questionEl.style.display = '';
      starsEl.setAttribute('aria-hidden', 'false');
      document.querySelectorAll('.star').forEach(function(s) { s.disabled = false; });
      starsEl.classList.add('stars-ready');
    }

    roomInput.addEventListener('input', function() {
      var val = roomInput.value.replace(/\D/g, '');
      roomInput.value = val;
      roomError.textContent = '';
      if (val.length === 3) {
        if (validateRoom(val)) {
          enableStars(val);
        } else {
          roomError.textContent = 'Please enter a valid room number (101–130 or 201–230).';
        }
      }
    });

    roomSkip.addEventListener('click', function() {
      enableStars(null);
    });

    stars.forEach(function(star) {
      star.addEventListener('click', function() {
        if (submitted) return;
        selectedRating = parseInt(star.getAttribute('data-value'));
        highlightStars(selectedRating);
        starLabelEl.textContent = starLabels[selectedRating] || ' ';
        setTimeout(function() { submitRating(selectedRating); }, 500);
      });

      star.addEventListener('mouseenter', function() {
        if (submitted) return;
        var val = parseInt(star.getAttribute('data-value'));
        highlightStars(val);
        starLabelEl.textContent = starLabels[val] || ' ';
      });

      star.addEventListener('mouseleave', function() {
        if (submitted) return;
        highlightStars(selectedRating);
        starLabelEl.textContent = selectedRating ? (starLabels[selectedRating] || ' ') : ' ';
      });
    });

    function highlightStars(value) {
      stars.forEach(function(s) {
        var v = parseInt(s.getAttribute('data-value'));
        if (v <= value) { s.classList.add('selected'); }
        else { s.classList.remove('selected'); }
      });
    }

    function submitRating(rating) {
      if (!hotelSlug) return;
      submitted = true;
      document.getElementById('status').textContent = 'Submitting…';
      fetch('/api/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating: rating, hotelSlug: hotelSlug, roomNumber: roomNumber })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        document.body.classList.add('fade-out');
        setTimeout(function() {
          if (data.action === 'redirect') {
            window.location.href = data.url;
          } else if (data.action === 'feedback') {
            window.location.href = 'feedback.html?token=' + encodeURIComponent(data.reviewToken) + '&hotel=' + encodeURIComponent(hotelSlug);
          }
        }, 230);
      })
      .catch(function() {
        document.getElementById('status').textContent = 'Something went wrong. Please try again.';
        submitted = false;
        highlightStars(0);
      });
    }

    // Reset state smoothly when user navigates back (no reload flash)
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        submitted = false;
        selectedRating = 0;
        roomNumber = null;
        roomConfirmed = false;
        highlightStars(0);
        starLabelEl.textContent = '\u00a0';
        document.getElementById('status').textContent = '';
        // Reset room UI
        roomInput.value = '';
        roomError.textContent = '';
        roomWrap.style.display = '';
        questionEl.style.display = 'none';
        starsEl.setAttribute('aria-hidden', 'true');
        document.querySelectorAll('.star').forEach(function(s) { s.disabled = true; });
        starsEl.classList.remove('stars-ready');
        document.body.classList.remove('fade-out');
        document.body.style.animation = 'none';
        document.body.offsetHeight; // force reflow
        document.body.style.animation = '';
      }
    });

    function applyTheme(t) {
      var r = document.documentElement.style;
      r.setProperty('--theme-accent', t.accent);
      r.setProperty('--theme-gradient', t.gradient);
      r.setProperty('--theme-star', t.starColor);
      r.setProperty('--theme-star-glow', t.starGlow);
      r.setProperty('--theme-btn-gradient', t.btnGradient);
      r.setProperty('--theme-btn-text', t.btnText);
      r.setProperty('--theme-divider', t.dividerColor);
      r.setProperty('--theme-card-border', t.cardBorder);
      r.setProperty('--theme-card-accent', t.cardAccent);
      document.body.classList.add('themed');
      if (t.slug) document.body.dataset.hotel = t.slug;
    }
  </script>
</body>
</html>
