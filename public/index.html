<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate Your Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <img id="hotel-logo" class="hotel-logo" src="" alt="" style="display:none" />
    <h1 class="hotel-name" id="hotel-name">Loading...</h1>
    <p class="cold-start-msg" id="cold-start-msg"></p>

    <div class="divider"></div>
    <p class="question">How was your stay?</p>

    <div class="stars" id="stars">
      <button class="star" data-value="1" aria-label="1 star">&#9733;</button>
      <button class="star" data-value="2" aria-label="2 stars">&#9733;</button>
      <button class="star" data-value="3" aria-label="3 stars">&#9733;</button>
      <button class="star" data-value="4" aria-label="4 stars">&#9733;</button>
      <button class="star" data-value="5" aria-label="5 stars">&#9733;</button>
    </div>

    <p id="star-label" class="star-label">&nbsp;</p>

    <p class="status-message" id="status"></p>
  </div>

  <script>
    var hotelSlug = new URLSearchParams(window.location.search).get('hotel');
    var hotelNameEl = document.getElementById('hotel-name');
    var coldStartEl = document.getElementById('cold-start-msg');

    // If no hotel slug in URL, show error and disable stars
    if (!hotelSlug) {
      hotelNameEl.textContent = 'Hotel not found. Please check your link.';
      hotelNameEl.style.color = '#d0021b';
      document.querySelectorAll('.star').forEach(function(s) { s.disabled = true; });
    } else {
      // Retry fetching hotel name up to 3 times with 5s delay (cold start resilience)
      var attempts = 0;
      var coldStartTimer = setTimeout(function() {
        coldStartEl.textContent = 'Waking up the server, one moment…';
      }, 5000);

      function fetchConfig() {
        attempts++;
        fetch('/api/config?hotel=' + encodeURIComponent(hotelSlug))
          .then(function(response) {
            if (!response.ok) throw new Error('not ok');
            return response.json();
          })
          .then(function(data) {
            clearTimeout(coldStartTimer);
            coldStartEl.textContent = '';
            hotelNameEl.classList.remove('loading-pulse');
            hotelNameEl.textContent = data.hotelName;
            document.title = data.hotelName + ' — Rate Your Stay';
            if (data.hotelLogo) {
              var logoEl = document.getElementById('hotel-logo');
              logoEl.src = data.hotelLogo;
              logoEl.alt = data.hotelName + ' logo';
              logoEl.style.display = 'block';
            }
            if (data.theme) { applyTheme(data.theme); try { sessionStorage.setItem('ht_' + hotelSlug, JSON.stringify(data.theme)); } catch(e) {} }
          })
          .catch(function() {
            if (attempts < 3) {
              setTimeout(fetchConfig, 5000);
            } else {
              clearTimeout(coldStartTimer);
              coldStartEl.textContent = '';
              hotelNameEl.classList.remove('loading-pulse');
              hotelNameEl.textContent = 'Rate Your Stay';
            }
          });
      }
      hotelNameEl.classList.add('loading-pulse');
      fetchConfig();
    }

    // Star labels
    var starLabels = { 1: 'Terrible', 2: 'Poor', 3: 'Okay', 4: 'Great', 5: 'Excellent' };
    var starLabelEl = document.getElementById('star-label');
    var stars = document.querySelectorAll('.star');
    var selectedRating = 0;
    var submitted = false;

    stars.forEach(function(star) {
      star.addEventListener('click', function() {
        if (submitted) return;
        selectedRating = parseInt(star.getAttribute('data-value'));
        highlightStars(selectedRating);
        starLabelEl.textContent = starLabels[selectedRating] || ' ';
        setTimeout(function() { submitRating(selectedRating); }, 500);
      });

      star.addEventListener('mouseenter', function() {
        if (submitted) return;
        var val = parseInt(star.getAttribute('data-value'));
        highlightStars(val);
        starLabelEl.textContent = starLabels[val] || ' ';
      });

      star.addEventListener('mouseleave', function() {
        if (submitted) return;
        highlightStars(selectedRating);
        starLabelEl.textContent = selectedRating ? (starLabels[selectedRating] || ' ') : ' ';
      });
    });

    function highlightStars(value) {
      stars.forEach(function(s) {
        var v = parseInt(s.getAttribute('data-value'));
        if (v <= value) { s.classList.add('selected'); }
        else { s.classList.remove('selected'); }
      });
    }

    function submitRating(rating) {
      if (!hotelSlug) return;
      submitted = true;
      document.getElementById('status').textContent = 'Submitting…';
      fetch('/api/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating: rating, hotelSlug: hotelSlug })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (data.action === 'redirect') {
          window.location.href = data.url;
        } else if (data.action === 'feedback') {
          window.location.href = 'feedback.html?token=' + encodeURIComponent(data.reviewToken) + '&hotel=' + encodeURIComponent(hotelSlug);
        }
      })
      .catch(function() {
        document.getElementById('status').textContent = 'Something went wrong. Please try again.';
        submitted = false;
        highlightStars(0);
      });
    }

    function applyTheme(t) {
      var r = document.documentElement.style;
      r.setProperty('--theme-accent', t.accent);
      r.setProperty('--theme-gradient', t.gradient);
      r.setProperty('--theme-star', t.starColor);
      r.setProperty('--theme-star-glow', t.starGlow);
      r.setProperty('--theme-btn-gradient', t.btnGradient);
      r.setProperty('--theme-btn-text', t.btnText);
      r.setProperty('--theme-divider', t.dividerColor);
      r.setProperty('--theme-card-border', t.cardBorder);
      r.setProperty('--theme-card-accent', t.cardAccent);
      document.body.classList.add('themed');
      if (t.slug) document.body.dataset.hotel = t.slug;
    }
  </script>
</body>
</html>
